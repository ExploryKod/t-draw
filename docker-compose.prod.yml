services:
  app:
    build:
      context: .
      dockerfile: Dockerfile
      args:
        - WWW_USER=${WWW_USER:-1000}
    container_name: t-draw-app
    restart: unless-stopped
    working_dir: /var/www/html
    volumes:
      - ./storage:/var/www/html/storage
      - ./bootstrap/cache:/var/www/html/bootstrap/cache
      - ./.env.production:/var/www/html/.env:ro
    environment:
      - APP_ENV=production
    env_file:
      - .env.production
    depends_on:
      - mysql
    networks:
      - t-draw-network

  websocket:
    build:
      context: .
      dockerfile: Dockerfile.websocket
    container_name: t-draw-websocket
    restart: unless-stopped
    environment:
      - NODE_ENV=production
      - WS_PORT=${WS_PORT:-8001}
      - APP_URL=${APP_URL}
      - ALLOWED_ORIGINS=${ALLOWED_ORIGINS:-${APP_URL}}
    env_file:
      - .env.production
    ports:
      - "${WS_PORT:-30002}:8001"  # WebSocket sur port 30002 par défaut (évite conflit)
    networks:
      - t-draw-network
    depends_on:
      - app

  nginx:
    image: nginx:alpine
    container_name: t-draw-nginx
    restart: unless-stopped
    ports:
      - "30000:80"   # HTTP sur port 30000 (évite conflit avec autres services)
      - "30001:443"  # HTTPS sur port 30001 (évite conflit avec autres services)
    volumes:
      - ./public:/var/www/html/public:ro
      - ./docker/nginx/nginx.conf:/etc/nginx/nginx.conf:ro
      - ./docker/nginx/conf.d/app-ip.conf:/etc/nginx/conf.d/00-app.conf:ro
      - ./docker/nginx/ssl:/etc/nginx/ssl:ro
    command: >
      sh -c "rm -f /etc/nginx/conf.d/default.conf && nginx -g 'daemon off;'"
    depends_on:
      - app
    networks:
      - t-draw-network

  mysql:
    image: mysql:8.0
    container_name: t-draw-mysql-prod
    restart: unless-stopped
    environment:
      MYSQL_ROOT_PASSWORD: ${DB_ROOT_PASSWORD}
      MYSQL_DATABASE: ${DB_DATABASE}
      MYSQL_USER: ${DB_USERNAME}
      MYSQL_PASSWORD: ${DB_PASSWORD}
    volumes:
      - mysql_data:/var/lib/mysql
    networks:
      - t-draw-network
    ports:
      - "127.0.0.1:3306:3306"  # Only accessible from host

volumes:
  mysql_data:
    driver: local

networks:
  t-draw-network:
    driver: bridge

